<!doctype html>
<html>
<head>
<meta charset='utf-8'>
<script type='importmap'>
{
  "imports": {
    "react": "https://esm.sh/react@18",
    "react-dom/client": "https://esm.sh/react-dom@18/client"
  }
}
</script>
<script type='module'>
  import * as Remount from '../dist/index.js'
  import React from 'react'
  window.Remount = Remount
  window.React = React
</script>
</head>
<body>
  <h1>Web components test</h1>
  <x-app></x-app>
  <script type='module'>
    const h = React.createElement
    const Greeter = ({ name }) => {
      return h('div', { style: { border: 'solid 1px #ccc' } }, 'Oh hello, ', name, '!')
    }

    class App extends React.Component {
      constructor () {
        super()
        this.state = { name: '...' }
      }

      componentDidMount () {
        setInterval(() => {
          this.setState({ name: this.getRandomName() })
        }, 300)
      }

      getRandomName () {
        const names = ['Jason', 'James', 'Jessie', 'Janice', 'Jack', 'Jordan']
        return names[Math.round(Math.random() * (names.length - 1))]
      }

      render () {
        return h('div', {},
          'Greeting ', this.state.name, ':',
          h('x-greeter', { 'props-json': JSON.stringify({ name: this.state.name }) })
        )
      }
    }

    Remount.define({
      'x-greeter': Greeter,
      'x-app': App
    })
  </script>
</body>
</html>
